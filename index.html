*{box-sizing:border-box}
html,body{margin:0;height:100%}

.field{display:flex;flex-direction:column;gap:6px}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function dk(){return DAYS[S.day].k;}
function present(kid){var a=S.att[dk()]||{};return a[kid.id]!==false;}
function kidsOf(gi){return KIDS.filter(function(k){return k.g===gi;});}
function absCount(){var a=S.att[dk()]||{},c=0;for(var k in a){if(a[k]===false)c++;}return c;}
function takenCount(){var t=S.taken[dk()]||{},c=0;for(var g=0;g<6;g++){if(t[g])c++;}return c;}
function outOf(kid){return (S.out[dk()]||{})[kid.id];}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hide");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.add("hide");},2600);}
function isStaff(d){return d==="mon"||d==="dir"||d.indexOf("tal:")===0||d.indexOf("per:")===0;}
function perMon(d){var p=d.slice(4).split("|"),t=TALLERES.filter(function(x){return x.id===p[0];})[0];return t?{t:t,m:mons(t)[+p[1]]}:null;}
function destLabel(d){if(d.indexOf("tal:")===0){var tt=TALLERES.filter(function(x){return x.id===d.slice(4);})[0];return tt?"Monitor de "+tt.name:d;}if(d.indexOf("per:")===0){var pm=perMon(d);return pm&&pm.m?pm.m.name+" (personal)":"Monitor (personal)";}if(d==="all")return "Todas las familias";if(d==="mon")return "Monitores";if(d==="dir")return "Dirección";if(d.indexOf("lvl:")===0)return d.slice(4);var g=GROUPS.filter(function(x){return x.id===d;})[0];return g?"Familias de "+g.name:d;}

function dayChips(){return '<div class="chips" role="group" aria-label="Día">'+DAYS.map(function(d,i){return '<button class="chip" data-a="day" data-v="'+i+'" aria-pressed="'+(S.day===i)+'">'+d.name+'</button>';}).join("")+'</div>';}
function groupSel(id,val,ch){return '<select id="'+id+'" data-c="'+ch+'" aria-label="Grupo">'+GROUPS.map(function(g,i){return '<option value="'+i+'"'+(val===i?" selected":"")+'>'+g.name+' · '+g.lvl+'</option>';}).join("")+'</select>';}
function top(title,sub){return '<div class="top"><div><h1>'+title+'</h1><p class="sub">'+sub+'</p></div><span class="demo">Prototipo · datos de ejemplo</span></div>';}

function board(di,hlG){
  var h='<div class="scroll"><div class="board"><div class="hd">Taller</div>'+MODS.map(function(m){return '<div class="hd">'+m.n+'<small>'+m.h+'</small></div>';}).join("");

    h+='<div class="tname t-'+t.id+'"><span class="sw s-'+t.id+'"></span><span>'+t.name+(t.parts?'<br><span class="muted" style="color:inherit;opacity:.85">Hoy: '+partName(t,di)+'</span>':'')+'</span></div>';

    np.map(function(x){var r=x[1],k=kidById(r.kid);return '<div class="alert info"><span><b>'+esc(k?k.name:"")+'</b> ('+(k?GROUPS[k.g].name:"")+') se retira el <b>'+x[0].name.toLowerCase()+' a las '+esc(r.time)+'</b>. Lo retira '+esc(r.by)+' ('+esc(r.rel)+') · '+esc(r.tel)+(r.motivo?' · '+esc(r.motivo):'')+'. Avisó: '+esc(r.reg)+'.</span>'+pickBtns(r)+'</div>';}).join("")+'</div></div>';

function parseRows(rows,defG,replace){
  rows=rows.filter(function(r){return r&&r.some(function(c){return String(c||"").trim();});});
  if(!rows.length)return 0;
  var hd=rows[0].map(function(c){return String(c||"").toLowerCase().trim();}),iN=-1,iA=-1,iG=-1;
  hd.forEach(function(c,i){if(iN<0&&c.indexOf("nombre")===0)iN=i;else if(iA<0&&c.indexOf("apellido")===0)iA=i;else if(iG<0&&(c.indexOf("grupo")===0||c.indexOf("curso")===0))iG=i;});
  var body=rows;if(iN>=0)body=rows.slice(1);else{iN=0;iG=rows[0].length>1?1:-1;}
  var added=[];
  body.forEach(function(r,j){var nm=String(r[iN]||"").trim();if(iA>=0&&r[iA])nm+=" "+String(r[iA]).trim();if(!nm)return;var g=iG>=0?normG(r[iG]):-1;if(g<0)g=defG;added.push({id:"n"+Date.now()+"_"+j,g:g,name:nm,aut:[]});});
  if(replace){S.kids=added;}else{S.kids=S.kids.concat(added);}
  KIDS=S.kids;S.att={};S.taken={};S.out={};
  return added.length;
}

    var av=S.avisos.filter(function(x){return String(x.id)===v;})[0];if(!av)return;
    var txt="*École de Jeu · "+av.title+"*\n\n"+msgBody(av);
    try{navigator.clipboard.writeText(txt).then(function(){toast("Texto copiado.");},function(){toast("No se pudo copiar; selecciona el texto del aviso.");});}catch(err){toast("No se pudo copiar; selecciona el texto del aviso.");}
    return;
  }
  else if(a==="toast"){toast(v);return;}
  else if(a==="reset"){try{localStorage.removeItem("edj-proto-v2");}catch(err){}location.reload();return;}
  save();render();
});
document.addEventListener("change",function(e){
  var c=e.target.getAttribute&&e.target.getAttribute("data-c");if(!c||c==="pick")return;
  var val=e.target.value;
  if(c==="moveKid"){var kk=S.kids.filter(function(k){return k.id===e.target.getAttribute("data-k");})[0];if(kk){kk.g=+val;toast(kk.name+" movido a "+GROUPS[+val].name+".");}}
  else if(c==="famKid")S.famKid=val;else if(c==="rkid")S.rkid=val;else{S[c]=+val;if(c==="rgroup")S.rkid="";}
  save();render();
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&S.modal){S.modal=null;save();render();}});
render();
})();
</script>
</body>
